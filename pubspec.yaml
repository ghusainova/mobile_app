name: kolesa_manager_app
description: "Kolesa Super App"
version: 1.0.62+63

environment:
  sdk: ">=3.2.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  #performance
  flutter_displaymode: ^0.6.0

  #UI
  cupertino_icons: ^1.0.2
  skeletonizer: ^1.0.1
  badges: ^3.1.2
  scroll_to_index: ^3.0.1

  #dependency injection
  get_it: ^7.6.0
  injectable: ^2.1.2

  #BLoC for state management
  flutter_bloc: ^8.1.6
  bloc: ^9.2.0
  meta: ^1.10.0
  provider: ^6.1.1

  #remote api
  dio: ^5.4.3+1
  awesome_dio_interceptor: ^1.2.0

  #routing in app
  go_router: ^13.0.1
  back_button_interceptor: ^7.0.3

  #for generation
  
  retrofit: ^4.0.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  #app version
  package_info_plus: ^5.0.1
  flutter_device_imei: ^0.0.2

  #storage
  flutter_secure_storage: ^9.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.2

  #for logging
  logger: ^2.3.0
  sentry_flutter: ^8.0.0

  #media
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  easy_image_viewer: ^1.5.0
  video_player: ^2.8.3
  video_compress_v2: ^1.0.0+1

  #work with documents
  printing: ^5.12.0
  easy_pdf_viewer: ^1.0.8
  pdf: ^3.10.8

  #camera
  image_picker: ^1.0.7
  pretty_qr_code: ^3.2.1
  cunning_document_scanner: ^1.2.1

  #formatter
  mask_text_input_formatter: ^2.8.0
  intl: ^0.19.0

  #code formatter
  dart_style: ^2.3.6
  flutter_lints: ^4.0.0

  #tools/converters
  collection: ^1.18.0
  carousel_slider: ^4.2.1
  url_launcher: ^6.2.5
  another_flushbar: ^1.12.30

dev_dependencies:
  flutter_test:
    sdk: flutter

  #Generators
  build_runner: ^2.4.11
  injectable_generator: ^2.1.6
  json_serializable: ^6.7.0
  freezed: ^2.3.5
  go_router_builder: ^2.4.1
  retrofit_generator: ^8.0.6
  source_gen: ^1.5.0
  mason_cli: ^0.1.0-dev.54

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/car_photo_inspection/exterior/
    - assets/icons/car_photo_inspection/interior/
    - assets/icons/car_photo_inspection/sto_vin/
    - assets/icons/car_photo_inspection/history/
    - assets/icons/car_photo_inspection/reg_cert/

    - assets/images/
    - assets/images/car_inspection/defects/
    - assets/app_icon/

  fonts:
    - family: Roboto Flex
      fonts:
        - asset: assets/fonts/RobotoFlex-VariableFont.ttf
